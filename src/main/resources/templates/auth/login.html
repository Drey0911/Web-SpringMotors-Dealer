<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SpringMotors</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/stylesLogin.css">

</head>
<body>
    <!-- Carousel Background -->
    <div class="carousel-bg">
        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Car 1" class="carousel-img" style="opacity: 1;">
        <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Car 2" class="carousel-img">
        <img src="https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Car 3" class="carousel-img">
        <img src="images/carrusel/carrusel2.png" alt="Car 5" class="carousel-img">  
        <img src="images/carrusel/carrusel3.png" alt="Car 6" class="carousel-img">  
        <div class="overlay"></div>
    </div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-car"></i>
                Spring<span>Motors</span>
            </div>
            
            <h2 class="login-title">Iniciar Sesión</h2>
            
 <form th:action="@{/login}" method="post">
    <input type="hidden" name="targetUrl" th:value="${param.redirect}">
    
    <div class="form-group username-field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
    </div>
    
    <div class="form-group password-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="login-btn">Iniciar Sesión</button>
        <a href="/" class="back-btn">Volver al Inicio</a>
    </div>

    <div class="login-links">
        <a href="/registro">¿No tienes cuenta? Regístrate</a>
    </div>
</form>
            
            <div th:if="${param.error}" class="login-message login-error">
                <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos
            </div>
            
            <div th:if="${param.registroExitoso}" class="login-message login-success">
                <i class="fas fa-check-circle"></i> Registro exitoso. Por favor inicia sesión.
            </div>
        </div>
    </div>

    <script>
        // Carousel functionality
        const slides = document.querySelectorAll('.carousel-bg .carousel-img');
        let current = 0;
        
        function nextSlide() {
            slides[current].style.opacity = 0;
            current = (current + 1) % slides.length;
            slides[current].style.opacity = 1;
        }
        
        // Change slide every 5 seconds
        setInterval(nextSlide, 5000);
        
        // Initialize carousel
        slides.forEach((slide, index) => {
            if (index !== 0) {
                slide.style.opacity = 0;
            }
        });
    </script>
</body>
</html>
