<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SpringMotors</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>    
  :root {
            --primary-dark: #0a0a23;
            --secondary-dark: #1a1a2e;
            --accent-red: #9d0208;
            --accent-blue: #14213d;
            --text-light: #f8f9fa;
            --text-gray: #adb5bd;
            --gold-accent: #d4af37;
        }
        
        body {
            background-color: #f8f9fa;
            color: var(--primary-dark);
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            padding: 1rem 2rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
            border-bottom: 3px solid var(--gold-accent);
        }
        
        .logo {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }
        
        .logo i {
            margin-right: 12px;
            color: var(--accent-red);
            font-size: 1.5em;
        }
        
        .logo .spring {
            color: white;
        }
        
        .logo .motors {
            color: var(--accent-red);
        }
        
        .form-container {
            max-width: 700px;
            margin: 3rem auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .form-header {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(10, 10, 35, 0.1);
            text-align: center;
        }
        
        .form-title {
            color: var(--primary-dark);
            font-weight: 800;
            margin: 0;
            font-size: 2.2rem;
            position: relative;
            display: inline-block;
            letter-spacing: -0.5px;
        }
        
        .form-title:after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent-red);
            border-radius: 2px;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }
        
        .form-control, .form-select {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.1);
        }
        
        .form-text {
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        
        .form-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 2px solid rgba(10, 10, 35, 0.1);
        }
        
        .btn {
            padding: 12px 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary {
            background: white;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }
        
        .btn-secondary:hover {
            background: rgb(20, 33, 61);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: var(--accent-red);
            border: none;
            box-shadow: 0 4px 12px rgba(157, 2, 8, 0.3);
        }
        
        .btn-primary:hover {
            background: #7d0106;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(157, 2, 8, 0.4);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-gray);
        }
        
        .password-container {
            position: relative;
        }
        
        .invalid-feedback {
            color: var(--accent-red);
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
                margin: 2rem auto;
            }
            
            .form-title {
                font-size: 1.8rem;
            }
            
            .form-footer {
                flex-direction: column-reverse;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
</style>
<body>
    <!-- Navbar elegante -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/">
                <i class="fas fa-car"></i>
                <span class="spring">Spring</span><span class="motors">Motors</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title" th:text="${usuario.id} ? 'Editar Usuario' : 'Nuevo Usuario'">
                    Formulario de Usuario
                </h2>
            </div>
            
            <form th:action="${usuario.id} ? @{/usuarios/editar/{id}(id=${usuario.id})} : @{/usuarios/nuevo}" 
                  th:object="${usuario}" method="post" id="userForm" novalidate>
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" id="currentPassword" th:value="${usuario.contrasena}" />
                
                <div class="mb-4">
                    <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="nombreUsuario" 
                           th:field="*{nombreUsuario}" required>
                    <div class="invalid-feedback">Por favor ingrese un nombre de usuario</div>
                </div>
                
                <div class="mb-4">
                    <label for="contrasena" class="form-label">
                        Contraseña
                        <span th:if="${usuario.id}" class="form-text">(Dejar vacío para mantener la contraseña actual)</span>
                        <span th:unless="${usuario.id}" class="form-text">(Requerida para nuevos usuarios)</span>
                    </label>
                    <div class="password-container">
                        <input type="password" class="form-control" id="contrasena" 
                               th:field="*{contrasena}"
                               th:required="${usuario.id} ? false : true"
                               autocomplete="new-password">
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                    <div class="invalid-feedback">Por favor ingrese una contraseña</div>
                </div>
                
                <div class="mb-4">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select" id="rol" th:field="*{rol}" required>
                        <option value="">Seleccione un rol</option>
                        <option value="ADMIN">Administrador</option>
                        <option value="VENTAS">Ventas</option>
                        <option value="MECANICO">Mecanico</option>
                        <option value="USER">Usuario</option>
                         <option value="GERENTE">Gerente</option>
                    </select>
                    <div class="invalid-feedback">Por favor seleccione un rol</div>
                </div>
                
                <div class="form-footer">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Volver
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 
                        <span th:text="${usuario.id} ? 'Actualizar Usuario' : 'Crear Usuario'">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle para mostrar/ocultar contraseña
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#contrasena');
            
            if (togglePassword && password) {
                togglePassword.addEventListener('click', function() {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    this.classList.toggle('fa-eye-slash');
                });
            }
            
            // Validación de formulario
            (function() {
                'use strict'
                
                const form = document.getElementById('userForm');
                
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    // Si es edición y la contraseña está vacía, mantener la actual
                    const currentPassword = document.getElementById('currentPassword').value;
                    const passwordInput = document.getElementById('contrasena');
                    const isEditMode = currentPassword !== '';
                    
                    if (isEditMode && passwordInput.value === '') {
                        passwordInput.value = currentPassword;
                    }
                    
                    if (form.checkValidity()) {
                        form.submit();
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            })();
            
            // Mostrar mensaje de éxito si existe en la URL
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            
            if (successParam) {
                Swal.fire({
                    icon: 'success',
                    title: 'Operación exitosa',
                    text: successParam === 'create' ? 'Usuario creado correctamente' : 
                          successParam === 'update' ? 'Usuario actualizado correctamente' : 
                          'Operación completada',
                    timer: 2000,
                    showConfirmButton: false,
                    background: 'white',
                    position: 'top-end'
                });
            }
        });
    </script>
</body>
</html>
