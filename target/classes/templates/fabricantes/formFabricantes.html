<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${fabricante.id} ? 'Editar Fabricante' : 'Nuevo Fabricante'">Gestión de Fabricantes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-dark: #0a0a23;
            --secondary-dark: #1a1a2e;
            --accent-red: #9d0208;
            --accent-blue: #14213d;
            --text-light: #f8f9fa;
            --text-gray: #adb5bd;
            --gold-accent: #d4af37;
        }
        
        body {
            background-color: #f8f9fa;
            color: var(--primary-dark);
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            padding: 1rem 2rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
            border-bottom: 3px solid var(--gold-accent);
        }
        
        .logo {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }
        
        .logo i {
            margin-right: 12px;
            color: var(--accent-red);
            font-size: 1.5em;
        }
        
        .logo .spring {
            color: white;
        }
        
        .logo .motors {
            color: var(--accent-red);
        }
        
        .form-container {
            max-width: 700px;
            margin: 3rem auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .form-header {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(10, 10, 35, 0.1);
            text-align: center;
        }
        
        .form-title {
            color: var(--primary-dark);
            font-weight: 800;
            margin: 0;
            font-size: 2.2rem;
            position: relative;
            display: inline-block;
            letter-spacing: -0.5px;
        }
        
        .form-title:after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent-red);
            border-radius: 2px;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }
        
        .form-control, .form-select {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.1);
        }
        
        .form-text {
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        
        .form-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 2px solid rgba(10, 10, 35, 0.1);
        }
        
        .btn {
            padding: 12px 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary {
            background: white;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }
        
        .btn-secondary:hover {
            background: var(--accent-blue);
            color: white;
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: var(--accent-red);
            border: none;
            box-shadow: 0 4px 12px rgba(157, 2, 8, 0.3);
            color: white;
        }
        
        .btn-primary:hover {
            background: #7d0106;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(157, 2, 8, 0.4);
            color: white;
        }
        
        .invalid-feedback {
            color: var(--accent-red);
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
                margin: 2rem auto;
            }
            
            .form-title {
                font-size: 1.8rem;
            }
            
            .form-footer {
                flex-direction: column-reverse;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar elegante -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/">
                <i class="fas fa-car"></i>
                <span class="spring">Spring</span><span class="motors">Motors</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title" th:text="${fabricante.id} ? 'Editar Fabricante' : 'Nuevo Fabricante'">
                    Formulario de Fabricante
                </h2>
            </div>
            
            <form th:action="@{/fabricantes/guardar}" th:object="${fabricante}" method="post" id="manufacturerForm" novalidate>
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-4">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" 
                           th:field="*{nombre}" required>
                    <div class="invalid-feedback">Por favor ingrese el nombre del fabricante</div>
                </div>
                
                <div class="mb-4">
                    <label for="pais" class="form-label">País</label>
                    <input type="text" class="form-control" id="pais" 
                           th:field="*{pais}" required>
                    <div class="invalid-feedback">Por favor ingrese el país de origen</div>
                </div>
                
                <div class="mb-4">
                    <label for="presidente" class="form-label">Presidente</label>
                    <input type="text" class="form-control" id="presidente" 
                           th:field="*{presidente}">
                </div>
                
                <div class="form-footer">
                    <a th:href="@{/fabricantes/listar}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Volver
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 
                        <span th:text="${fabricante.id} ? 'Actualizar Fabricante' : 'Crear Fabricante'">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Validación de formulario
            (function() {
                'use strict'
                
                const form = document.getElementById('manufacturerForm');
                
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            })();
            
            // Mostrar mensaje de éxito si existe en la URL
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            
            if (successParam) {
                Swal.fire({
                    icon: 'success',
                    title: 'Operación exitosa',
                    text: successParam === 'create' ? 'Fabricante creado correctamente' : 
                          successParam === 'update' ? 'Fabricante actualizado correctamente' : 
                          'Operación completada',
                    timer: 2000,
                    showConfirmButton: false,
                    background: 'white',
                    position: 'top-end'
                });
            }
        });
    </script>
</body>
</html>
