<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Repuestos - SpringMotors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/css/stylesListar.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/">
                <i class="fas fa-car"></i>
                <span class="spring">Spring</span><span class="motors">Motors</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header-actions">
            <h2 class="page-title">Gestión de Repuestos</h2>
            
            <div class="d-flex align-items-center gap-4" style="flex-grow: 1; justify-content: flex-end;">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre..." class="form-control">
                    <button type="button" id="searchButton" class="btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                
                <a th:href="@{/repuestos/form}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nuevo Repuesto
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-hover" id="repuestosTable">
                <thead>
                    <tr>
                        <th class="text-center">Imagen</th>
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Marca</th>
                        <th class="text-center">Tipo</th>
                        <th class="text-center">Precio</th>
                        <th class="text-center">Proveedor</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="repuesto : ${repuestos}">
                        <td class="text-center">
                            <img th:if="${repuesto.foto != null}" 
                                 th:src="${repuesto.getFotoBase64()}" 
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                            <i th:unless="${repuesto.foto != null}" class="fas fa-box-open" style="font-size: 1.5rem;"></i>
                        </td>
                        <td class="text-center" th:text="${repuesto.nombre}"></td>
                        <td class="text-center" th:text="${repuesto.marca}"></td>
                        <td class="text-center" th:text="${repuesto.tipo}"></td>
                        <td class="text-center" th:text="${'$' + #numbers.formatDecimal(repuesto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-center" th:text="${repuesto.proveedor.nombre}"></td>
                        <td class="text-center">
                            <span th:classappend="${repuesto.estado == 'Disponible'} ? 'badge bg-success' : 
                                              'badge bg-danger'"
                                  th:text="${repuesto.estado}"></span>
                        </td>
                        <td class="text-center action-buttons">
                            <a th:href="@{/repuestos/form?id={id}(id=${repuesto.id})}" 
                               class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <button class="btn btn-sm btn-danger delete-btn" 
                                    th:data-id="${repuesto.id}">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${repuestos.empty}">
                        <td colspan="8" class="no-users">
                            <i class="fas fa-box-open"></i>
                            <h4>No se encontraron repuestos</h4>
                            <p class="text-muted">No hay repuestos registrados en el sistema</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Función de búsqueda
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const table = document.getElementById('repuestosTable');
            const rows = table.getElementsByTagName('tr');
            
            function filterTable() {
                const filter = searchInput.value.toUpperCase();
                
                for (let i = 1; i < rows.length; i++) {
                    const cell = rows[i].getElementsByTagName('td')[1]; // Columna de nombre
                    if (cell) {
                        const txtValue = cell.textContent || cell.innerText;
                        if (txtValue.toUpperCase().indexOf(filter) > -1) {
                            rows[i].style.display = '';
                        } else {
                            rows[i].style.display = 'none';
                        }
                    }
                }
            }
            
            searchButton.addEventListener('click', filterTable);
            searchInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    filterTable();
                }
            });
            
            // Confirmación para eliminar
            const deleteButtons = document.querySelectorAll('.delete-btn');
            
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const repuestoId = this.getAttribute('data-id');
                    
                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: "¡No podrás revertir esta acción!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#14213d',
                        cancelButtonColor: '#d33',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = '/repuestos/eliminar?id=' + repuestoId;
                        }
                    });
                });
            });
            
            // Mostrar mensaje de éxito
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            
            if (successParam) {
                Swal.fire({
                    icon: 'success',
                    title: 'Operación exitosa',
                    text: successParam === 'create' ? 'Repuesto creado correctamente' : 
                          successParam === 'update' ? 'Repuesto actualizado correctamente' : 
                          'Repuesto eliminado correctamente',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        });
    </script>
</body>
</html>
