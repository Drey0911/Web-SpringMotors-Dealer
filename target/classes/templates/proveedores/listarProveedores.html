<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores - SpringMotors</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="/css/stylesListar.css">
</head>
<body>
    <!-- Navbar elegante -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/">
                <i class="fas fa-car"></i>
                <span class="spring">Spring</span><span class="motors">Motors</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header-actions">
            <h2 class="page-title">Gestión de Proveedores de Repuestos</h2>
            
            <div class="d-flex align-items-center gap-4" style="flex-grow: 1; justify-content: flex-end;">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre..." class="form-control">
                    <button type="button" id="searchButton" class="btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                
                <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nuevo Proveedor
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-hover" id="proveedoresTable">
                <thead>
                    <tr>
                        <th class="text-center">Id</th>
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Encargado</th>
                        <th class="text-center">Teléfono</th>
                        <th class="text-center">Fabricantes</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="proveedor : ${proveedores}">
                        <td class="text-center" th:text="${proveedor.id}"></td>
                        <td class="text-center" th:text="${proveedor.nombre}"></td>
                        <td class="text-center" th:text="${proveedor.encargado}"></td>
                        <td class="text-center" th:text="${proveedor.telefono}"></td>
                        <td class="text-center">
                            <span th:each="fabricante, stat : ${proveedor.fabricantes}">
                                <span th:text="${fabricante.nombre}"></span>
                                <span th:unless="${stat.last}">, </span>
                            </span>
                        </td>
                        <td class="text-center action-buttons">
                            <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}" 
                               class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <button class="btn btn-sm btn-danger delete-btn" 
                                    th:data-id="${proveedor.id}">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${proveedores.empty}">
                        <td colspan="6" class="no-users">
                            <i class="fas fa-building"></i>
                            <h4>No se encontraron proveedores</h4>
                            <p class="text-muted">No hay proveedores registrados en el sistema</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Función de búsqueda en la tabla
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const table = document.getElementById('proveedoresTable');
            const rows = table.getElementsByTagName('tr');
            
            function filterTable() {
                const filter = searchInput.value.toUpperCase();
                
                for (let i = 1; i < rows.length; i++) {
                    const cell = rows[i].getElementsByTagName('td')[1]; // Columna de nombre
                    if (cell) {
                        const txtValue = cell.textContent || cell.innerText;
                        if (txtValue.toUpperCase().indexOf(filter) > -1) {
                            rows[i].style.display = '';
                        } else {
                            rows[i].style.display = 'none';
                        }
                    }
                }
            }
            
            searchButton.addEventListener('click', filterTable);
            searchInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    filterTable();
                }
            });
            
            // Confirmación para eliminar proveedor
            const deleteButtons = document.querySelectorAll('.delete-btn');
            
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const proveedorId = this.getAttribute('data-id');
                    
                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: "¡No podrás revertir esta acción!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#14213d',
                        cancelButtonColor: '#d33',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar',
                        background: 'white',
                        backdrop: `
                            rgba(10, 10, 35, 0.4)
                            url("/images/nyan-cat.gif")
                            left top
                            no-repeat
                        `
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = '/proveedores/eliminar/' + proveedorId;
                        }
                    });
                });
            });
            
            // Mostrar mensaje de éxito si existe en la URL
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            
            if (successParam) {
                Swal.fire({
                    icon: 'success',
                    title: 'Operación exitosa',
                    text: successParam === 'create' ? 'Proveedor creado correctamente' : 
                          successParam === 'update' ? 'Proveedor actualizado correctamente' : 
                          'Proveedor eliminado correctamente',
                    timer: 2000,
                    showConfirmButton: false,
                    background: 'white',
                    position: 'center'
                });
            }
        });
    </script>
</body>
</html>
