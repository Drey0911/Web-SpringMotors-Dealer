<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vehículos - SpringMotors</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/css/stylesListar.css">
</head>
<body>
    <!-- Navbar elegante -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" href="/">
                <i class="fas fa-car"></i>
                <span class="spring">Spring</span><span class="motors">Motors</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header-actions">
            <h2 class="page-title">Gestión de Vehículos</h2>
            
            <div class="d-flex align-items-center gap-4" style="flex-grow: 1; justify-content: flex-end;">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Buscar por marca o modelo..." class="form-control">
                    <button type="button" id="searchButton" class="btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                
                <a th:href="@{/vehiculos/formVehiculos}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nuevo Vehículo
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-hover" id="vehiclesTable">
                <thead>
                    <tr>
                        <th class="text-center">ID</th>
                        <th class="text-center">Marca</th>
                        <th class="text-center">Modelo</th>
                        <th class="text-center">Año</th>
                        <th class="text-center">Kilometraje</th>
                        <th class="text-center">Precio</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Imagen</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="vehiculo : ${vehiculos}">
                        <td class="text-center" th:text="${vehiculo.id}"></td>
                        <td class="text-center" th:text="${vehiculo.fabricante.nombre}"></td>
                        <td class="text-center" th:text="${vehiculo.modelo}"></td>
                        <td class="text-center" th:text="${vehiculo.anio}"></td>
                        <td class="text-center" th:text="${vehiculo.kilometraje}"></td>
                       <td class="text-center">
    <span th:text="${'$' + #numbers.formatDecimal(vehiculo.precio, 1, 'POINT', 2, 'COMMA')}"></span> COP
</td>
                        <td>
                            <span th:classappend="${vehiculo.estado == 'Disponible'} ? 'status-badge badge-disponible' : 
                                                  (${vehiculo.estado == 'Vendido'} ? 'status-badge badge-vendido' : 
                                                  'status-badge badge-reservado')" 
                                  th:text="${vehiculo.estado}">
                            </span>
                        </td>
                        <td>
                            <img th:if="${vehiculo.foto != null}" 
                                 th:src="${vehiculo.getFotoBase64()}" 
                                 class="vehicle-image" 
                                 alt="Imagen del vehículo"/>
                            <i th:if="${vehiculo.foto == null}" class="fas fa-car-side no-image"></i>
                        </td>
                        <td class="action-buttons">
                            <a th:href="@{/vehiculos/formVehiculos(id=${vehiculo.id})}" 
                               class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <button class="btn btn-sm btn-danger delete-btn" 
                                    th:data-id="${vehiculo.id}">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${vehiculos.empty}">
                        <td colspan="8" class="no-vehicles">
                            <i class="fas fa-car-crash"></i>
                            <h4>No se encontraron vehículos</h4>
                            <p class="text-muted">No hay vehículos registrados en el sistema</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Función de búsqueda en la tabla
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const table = document.getElementById('vehiclesTable');
            const rows = table.getElementsByTagName('tr');
            
            function filterTable() {
                const filter = searchInput.value.toUpperCase();
                
                for (let i = 1; i < rows.length; i++) {
                    const marcaCell = rows[i].getElementsByTagName('td')[1]; // Columna de marca
                    const modeloCell = rows[i].getElementsByTagName('td')[2]; // Columna de modelo
                    
                    if (marcaCell && modeloCell) {
                        const marcaValue = marcaCell.textContent || marcaCell.innerText;
                        const modeloValue = modeloCell.textContent || modeloCell.innerText;
                        
                        if (marcaValue.toUpperCase().indexOf(filter) > -1 || 
                            modeloValue.toUpperCase().indexOf(filter) > -1) {
                            rows[i].style.display = '';
                        } else {
                            rows[i].style.display = 'none';
                        }
                    }
                }
            }
            
            searchButton.addEventListener('click', filterTable);
            searchInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    filterTable();
                }
            });
            
            // Confirmación para eliminar vehículo
            const deleteButtons = document.querySelectorAll('.delete-btn');
            
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const vehicleId = this.getAttribute('data-id');
                    
                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: "¡No podrás revertir esta acción!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#14213d',
                        cancelButtonColor: '#d33',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar',
                        background: 'white',
                        backdrop: `
                            rgba(10, 10, 35, 0.4)
                            url("/images/nyan-cat.gif")
                            left top
                            no-repeat
                        `
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = '/vehiculos/eliminar?id=' + vehicleId;
                        }
                    });
                });
            });
            
            // Mostrar mensaje de éxito si existe en la URL
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            
            if (successParam) {
                Swal.fire({
                    icon: 'success',
                    title: 'Operación exitosa',
                    text: successParam === 'create' ? 'Vehículo creado correctamente' : 
                          successParam === 'update' ? 'Vehículo actualizado correctamente' : 
                          'Operación completada',
                    timer: 2000,
                    showConfirmButton: false,
                    background: 'white',
                    position: 'center'
                });
            }
        });
    </script>
</body>
</html>
